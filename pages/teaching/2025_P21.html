				<section class="section">

					<h2 class="heading-2" data-i18n="p21_2025_td_tp_title"></h2>

					<!-- TD/TP 1 -->
					<article class="article">

						<h3 class="heading-3" data-i18n="p21_2025_td1_title"></h3>
						<p class="paragraph" data-i18n="p21_2025_td1_paragraph"></p>

						<!-- UML 1 : Account -->
						<div class="p21_svg_viewer">
							<div class="p21_svg_buttons">
								<button class="p21_svg_button_show" id=button_show_1 onclick="Show(1)">🔽</button>
								<button class="p21_svg_button_hide" id=button_hide_1 onclick="Hide(1)" disabled>🔼</button>
								<p class="paragraph">UML 1: Account</p>
							</div>
							<div class="p21_svg_image_viewer" id="svg_1" hidden>
								<img src="../../files/teaching/2025/P21/TD1_uml_1.svg"/>

						</div>

						<!-- UML 2 : Date -->
						<div class="p21_svg_viewer">

							<div class="p21_svg_image_viewer" id="svg_2" hidden>

					</article>

				</section>

				<!-- Script for showing/hiding SVGs -->
				<script>
					function Show(id)
					{
						//document.getElementById("svg_" + id).style.display = "block";
						document.getElementById("svg_" + id).hidden = false;
						document.getElementById("button_show_" + id).disabled = true;
						document.getElementById("button_hide_" + id).disabled = false;
					}
					function Hide(id)
					{
						//document.getElementById("svg_" + id).style.display = "none";
						document.getElementById("svg_" + id).hidden = true;
						document.getElementById("button_show_" + id).disabled = false;
						document.getElementById("button_hide_" + id).disabled = true;
					}
				</script>
